name: Build Gagaku

on:
  pull_request:
    types: [opened, closed, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      tagName:
        description: "Tag name"
        type: string
        default: ""
        required: false
      doRelease:
        description: "Publish new release"
        type: boolean
        default: false
        required: false
      doDevPreview:
        description: "Publish new dev preview"
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_release:
    name: Validate release tag
    if: ${{ github.event.inputs.doRelease == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate tag against pubspec version
        run: |
          set -e
          if [[ ! "$TAGNAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAGNAME' must use the format vMAJOR.MINOR.PATCH (e.g. v1.0.0)"
            exit 1
          fi
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "\"'[:space:]")"
          PUBSPEC_VERSION="${PUBSPEC_VERSION%%+*}"
          if [[ "${TAGNAME#v}" != "$PUBSPEC_VERSION" ]]; then
            echo "::error::Tag '$TAGNAME' does not match pubspec.yaml version '$PUBSPEC_VERSION'"
            exit 1
          fi
        env:
          TAGNAME: ${{ github.event.inputs.tagName }}
      - name: Ensure tag does not already exist
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAGNAME" > /dev/null
          STATUS=$?
          set -e
          case "$STATUS" in
            0) echo "::error::Tag '$TAGNAME' already exists; releases are immutable"; exit 1 ;;
            2) echo "Tag '$TAGNAME' is available" ;;
            *) echo "::error::Could not query remote tags (git exit $STATUS)"; exit 1 ;;
          esac
        env:
          TAGNAME: ${{ github.event.inputs.tagName }}

  build:
    needs: validate_release
    if: ${{ !cancelled() && (needs.validate_release.result == 'success' || needs.validate_release.result == 'skipped') && github.event.pull_request.draft == false && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    strategy:
      fail-fast: true
      matrix:
        builder: [windows, android]
        include:
          - builder: windows
            os: windows-latest
            pkg: windows
          - builder: android
            os: ubuntu-latest
            pkg: apk
          # - builder: linux
          #   os: ubuntu-latest
          #   pkg: linux

    name: Build Gagaku
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup Java
        if: matrix.builder == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: "stable"
          cache: true

      - name: Set up Packages (Linux)
        if: matrix.builder == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter config --enable-linux-desktop

      - name: Set up Packages (Windows)
        if: matrix.builder == 'windows'
        run: |
          flutter config --enable-windows-desktop
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV

      - run: flutter pub get

      - run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      # - working-directory: extension/
      #   run: |
      #     bun install --frozen-lockfile
      #     bun run deploy

      - name: Set up signing key
        if: matrix.builder == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          echo "storeFile=keystore.jks" >> key.properties
          echo "keyAlias=upload" >> key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> key.properties
        working-directory: ./android

      - name: Build Project
        run: flutter build ${{ matrix.pkg }}

      - name: Package Gagaku (Windows)
        id: windows-pkg
        if: matrix.builder == 'windows'
        run: |
          $RELEASE_PACKAGE_FILE = "gagaku-windows.zip"
          Compress-Archive build/windows/x64/runner/Release/* $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "artifact_slug=$release_filepath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Build Artifact (Windows)
        if: matrix.builder == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: gagaku-windows
          path: ${{ steps.windows-pkg.outputs.artifact_slug }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Build Artifact (Android)
        if: matrix.builder == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: gagaku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && github.event.inputs.doRelease == 'true' && github.event.inputs.tagName != '' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: Verify release assets
        run: |
          set -e
          for asset in app-release.apk gagaku-windows.zip; do
            if [[ ! -s "artifacts/$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done
      - name: Create release
        id: create_release
        run: |
          set -xe
          shopt -s nullglob
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          gh release create "$TAGNAME" --target "$COMMIT_SHA" --title "$TAGNAME" --generate-notes artifacts/*
          echo "tag_name=${TAGNAME}" >> $GITHUB_OUTPUT
          echo "rel_date=${RELDATE}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAGNAME: ${{ github.event.inputs.tagName }}
          COMMIT_SHA: ${{ github.sha }}

  publish_dev:
    name: Publish Dev Preview
    if: ${{ !cancelled() && (github.event.inputs.doDevPreview == 'true' || github.event.pull_request.merged == true) && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: Create preview release
        id: create_release
        run: |
          set -xe
          shopt -s nullglob
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          NAME="Dev Preview ($RELDATE)"
          TAGNAME="dev-preview"
          COMMIT_SHA="${{ github.sha }}"
          NOTES="Built from commit ${COMMIT_SHA}"
          gh release delete --cleanup-tag --yes "$TAGNAME" || true
          sleep 15
          gh release create "$TAGNAME" --prerelease --target "${{ github.ref }}" --title "$NAME" --notes "$NOTES" artifacts/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
